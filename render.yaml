# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# The persistent disk keeps the database and uploaded photos across restarts and deploys.
# (Persistent disks need a paid Render plan. On a free plan, data is wiped on every restart.)
services:
  - type: web
    name: campus-reporter
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: campus-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: STAFF_CODE        # the code the HOD / Admin Office use to create their accounts
        sync: false
      - key: SMTP_HOST         # email OTP (e.g. smtp.gmail.com)
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS         # Gmail "App Password", not your normal password
        sync: false
      - key: SMTP_FROM
        sync: false

# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# The persistent disk keeps the database and uploaded photos across restarts and deploys.
# (Persistent disks need a paid Render plan. On a free plan, data is wiped on every restart.)
services:
  - type: web
    name: campus-reporter
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: campus-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: STAFF_CODE        # the code the HOD / Admin Office use to create their accounts
        sync: false
      - key: TELEGRAM_BOT_TOKEN  # free phone verification (BotFather -> /newbot)
        sync: false
      - key: FAST2SMS_API_KEY  # SMS OTP (Fast2SMS dashboard -> Dev API)
        sync: false
      - key: FAST2SMS_ROUTE    # 'otp' (default) or 'q' for Quick SMS
        value: otp
      - key: WHATSAPP_TOKEN    # optional: WhatsApp codes (see README)
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_TEMPLATE
        sync: false
      - key: WHATSAPP_TEMPLATE_LANG
        value: en_US
      - key: GOOGLE_MAPS_API_KEY  # dashboard map (restrict the key to your site address)
        sync: false
      - key: SMS_DAILY_LIMIT   # max SMS per day for the whole site
        value: 300
